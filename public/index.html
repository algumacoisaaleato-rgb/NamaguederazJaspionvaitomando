<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#000"><link rel="stylesheet" href="/styles.css"><title>Namaguederaz</title></head><body><header><button>⚙</button><b>Namaguederaz</b><button>◉</button></header><main><h1>Assistir juntos.</h1><p class="muted">Crie uma sala ou entre em uma sala pública ativa.</p><button class="primary" onclick="document.getElementById('q').focus()">＋ Criar sala</button><section><h2>YouTube</h2><div class="search"><input id="q" placeholder="Pesquisar vídeo..."><button onclick="searchYT()">Pesquisar</button></div><div id="results"></div><div id="playerBox" hidden><div id="player"></div><button class="primary" onclick="createRoom()">Criar sala</button></div><p id="status" class="muted"></p></section><section><h2>Público</h2><div id="rooms" class="muted">Nenhuma sala pública ativa.</div></section></main><script src="https://www.youtube.com/iframe_api"></script><script>let ws,pickedId='',pickedTitle='',player;const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function connect(){ws=new WebSocket((location.protocol==='https:'?'wss:':'ws:')+'//'+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:'list-public'}));ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.type==='public-rooms')renderRooms(m.rooms);if(m.type==='room-created'||m.type==='room-joined')$('status').textContent='Sala: '+m.room.id;if(m.type==='error')$('status').textContent=m.message};ws.onclose=()=>setTimeout(connect,1500)}function renderRooms(a){$('rooms').innerHTML=a.length?a.map(r=>`<button class="room" onclick="join('${r.id}')"><b>${esc(r.title)}</b><span>${esc(r.provider)} · ${r.users} pessoa(s)</span></button>`).join(''):'Nenhuma sala pública ativa.'}function join(id){if(ws?.readyState===1)ws.send(JSON.stringify({type:'join-room',roomId:id}))}async function searchYT(){const q=$('q').value.trim();if(!q)return;$('results').innerHTML='<p class="muted">Pesquisando...</p>';try{const r=await fetch('/api/youtube-search?q='+encodeURIComponent(q)),d=await r.json();if(!r.ok)throw Error(d.error);$('results').innerHTML=d.length?d.map(v=>`<button class="video" onclick="openYT('${esc(v.id.videoId)}','${esc(v.snippet.title)}')"><img src="${esc(v.snippet.thumbnails?.medium?.url||'')}"><span><b>${esc(v.snippet.title)}</b><small>${esc(v.snippet.channelTitle||'')}</small></span></button>`).join(''):'<p class="muted">Nenhum vídeo encontrado.</p>'}catch(e){$('results').innerHTML='<p class="muted">Erro: '+esc(e.message)+'</p>'}}function openYT(id,title){pickedId=id;pickedTitle=title;$('playerBox').hidden=false;if(player)player.destroy();player=new YT.Player('player',{videoId:id,playerVars:{playsinline:1,rel:0},events:{onError:()=>{$('status').textContent='Este vídeo não permite reprodução incorporada.'}}})}function createRoom(){if(!pickedId||ws?.readyState!==1)return $('status').textContent='Conexão ainda não disponível.';ws.send(JSON.stringify({type:'create-room',title:pickedTitle+' — Sala',provider:'youtube',content:'https://www.youtube.com/watch?v='+pickedId,public:true}))}connect();</script></body></html>
